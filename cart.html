<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem('shinn_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Your Bag — Shinn</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-nav="">

<div id="site-header"></div>

<main class="wrap">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Home</a><span class="sep">/</span><span class="current">Bag</span>
  </nav>

  <div class="cart-layout" style="margin-top:12px;">
    <div id="cart-main"></div>
    <div id="cart-summary-wrap">
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div id="summary-body"></div>
        <div class="promo-row">
          <input type="text" id="promo-input" placeholder="Promo code">
          <button class="btn btn-secondary btn-sm" id="promo-apply">Apply</button>
        </div>
        <a href="checkout.html" class="btn btn-primary btn-block">Checkout</a>
        <a href="shop.html" class="btn btn-ghost btn-block center" style="margin-top:8px;">Continue Shopping</a>
      </div>
    </div>
  </div>
</main>

<div style="height:80px;"></div>
<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/cart-page.js"></script>
</body>
</html>
