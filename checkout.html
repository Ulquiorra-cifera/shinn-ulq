<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem('shinn_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Checkout — Shinn</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-nav="">

<div id="site-header"></div>

<main class="wrap">
  <div class="checkout-steps">
    <span>Bag</span><span>&rarr;</span><span class="active">Checkout</span><span>&rarr;</span><span>Confirmation</span>
  </div>

  <form class="checkout-layout" id="checkout-form" novalidate>
    <div>
      <div class="form-section">
        <h3>Contact</h3>
        <div class="form-grid">
          <div class="field full"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com"></div>
        </div>
      </div>

      <div class="form-section">
        <h3>Shipping Address</h3>
        <div class="form-grid">
          <div class="field"><label for="fname">First name</label><input id="fname" required></div>
          <div class="field"><label for="lname">Last name</label><input id="lname" required></div>
          <div class="field full"><label for="addr">Address</label><input id="addr" required placeholder="Street address"></div>
          <div class="field"><label for="city">City</label><input id="city" required></div>
          <div class="field"><label for="zip">Postal code</label><input id="zip" required></div>
          <div class="field"><label for="country">Country</label>
            <select id="country" required>
              <option>United States</option><option>Canada</option><option>United Kingdom</option>
              <option>Cambodia</option><option>Australia</option><option>Germany</option>
            </select>
          </div>
          <div class="field"><label for="phone">Phone</label><input id="phone" type="tel" required></div>
        </div>
      </div>

      <div class="form-section">
        <h3>Payment</h3>
        <div class="pay-methods">
          <div class="pay-method is-selected">Card</div>
          <div class="pay-method">PayPal</div>
          <div class="pay-method">Apple Pay</div>
        </div>
        <div class="form-grid">
          <div class="field full"><label for="card">Card number</label><input id="card" required placeholder="0000 0000 0000 0000" inputmode="numeric"></div>
          <div class="field"><label for="exp">Expiry</label><input id="exp" required placeholder="MM / YY"></div>
          <div class="field"><label for="cvc">CVC</label><input id="cvc" required placeholder="123" inputmode="numeric"></div>
        </div>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="place-order-btn">Place Order</button>
    </div>

    <aside>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div id="checkout-lines"></div>
        <div id="checkout-summary-rows" style="margin-top:8px;"></div>
      </div>
    </aside>
  </form>
</main>

<div style="height:80px;"></div>
<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/checkout.js"></script>
</body>
</html>
